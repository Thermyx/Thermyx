name: ThermyxApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ThermyxApp:
    type: application
    platform: iOS
    sources:
      - path: ThermyxApp
    resources:
      - path: ThermyxApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermyx.app
        INFOPLIST_FILE: ThermyxApp/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
