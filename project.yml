name: ThermyxApp
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # Sign in with Google through Firebase Authentication.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.4.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
  # Loads the insole's .glb into SceneKit.
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: "0.5.15"

targets:
  ThermyxApp:
    type: application
    platform: iOS
    sources:
      # Swift sources.
      - path: ThermyxApp
        excludes:
          - "Resources/**"
          - "Assets.xcassets/**"
          - "Info.plist"
          - "*.entitlements"
          - "BLE_PROTOCOL.md"
      # Widget snapshot and Live Activity types, shared with ThermyxWidgets.
      - path: Shared
      - path: ThermyxApp/Assets.xcassets
        buildPhase: resources
      # Archivo and Geist Mono static instances (OFL; see OFL.txt and
      # OFL-Geist.txt),
      # registered via UIAppFonts. Flattened into the bundle root so
      # UIAppFonts can name them directly.
      - path: ThermyxApp/Resources/Fonts
        buildPhase: resources
        excludes: ["*.txt"]
        createIntermediateGroups: true
      # Bundled Learning Center content and legal documents.
      - path: ThermyxApp/Resources/Content
        buildPhase: resources
      # The insole's hardware model, from the website, for the welcome screen.
      - path: ThermyxApp/Resources/Models
        buildPhase: resources
      # The optional onboarding walkthrough video (see the README beside it).
      - path: ThermyxApp/Resources/Media
        buildPhase: resources
        excludes: ["README.md"]
      # GoogleService-Info.plist goes here (see the README beside it).
      # Without it the app builds, but nobody can sign in.
      - path: ThermyxApp/Resources/Firebase
        buildPhase: resources
        excludes: ["README.md"]
      # Shipped for SIL OFL compliance.
      - path: ThermyxApp/Resources/Fonts/OFL.txt
        buildPhase: resources
      - path: ThermyxApp/Resources/Fonts/OFL-Geist.txt
        buildPhase: resources
    # CODE_SIGN_ENTITLEMENTS comes from here, so a paid team can add push
    # without touching this file (see Config/Thermyx.xcconfig).
    configFiles:
      Debug: Config/Thermyx.xcconfig
      Release: Config/Thermyx.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermyx.app.a
        INFOPLIST_FILE: ThermyxApp/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # REVERSED_CLIENT_ID from GoogleService-Info.plist, for the sign-in
        # redirect URL scheme in Info.plist.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.359633176064-bg3sg1j5bvp2a012gm01ne04e5kl2kec
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GLTFKit2
        product: GLTFKit2
      - target: ThermyxWidgets

  # Home Screen and Lock Screen widgets, the Live Activity and the Dynamic
  # Island. Reads the app's snapshot through the App Group.
  ThermyxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ThermyxWidgets
        excludes:
          - "Info.plist"
          - "ThermyxWidgets.entitlements"
      - path: Shared
      - path: ThermyxApp/Resources/Fonts/Archivo-Medium.ttf
        buildPhase: resources
      - path: ThermyxApp/Resources/Fonts/Archivo-SemiBold.ttf
        buildPhase: resources
      - path: ThermyxApp/Resources/Fonts/Archivo-Bold.ttf
        buildPhase: resources
      - path: ThermyxApp/Resources/Fonts/GeistMono-Medium.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermyx.app.a.widgets
        INFOPLIST_FILE: ThermyxWidgets/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: ThermyxWidgets/ThermyxWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Unit tests for the risk engine, formatting, and models.
  ThermyxAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThermyxAppTests
    dependencies:
      - target: ThermyxApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermyx.app.a.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  ThermyxApp:
    build:
      targets:
        ThermyxApp: all
    test:
      targets:
        - ThermyxAppTests
    run:
      config: Debug
  # Launches with simulated insoles (Debug only) so every control can be
  # exercised on the iOS Simulator, which has no Bluetooth.
  Thermyx Demo:
    build:
      targets:
        ThermyxApp: all
    test:
      targets:
        - ThermyxAppTests
    run:
      config: Debug
      commandLineArguments:
        "-ThermyxUIPreview simulator": true
